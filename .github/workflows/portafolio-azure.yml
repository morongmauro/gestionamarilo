# Publica la carpeta portafolio/ en Azure App Service.
# Se activa al subir cambios de portafolio/ a main, o a mano desde «Actions».
# No hace nada hasta que se configure en GitHub (Settings → Secrets and variables → Actions):
#   Variable  AZURE_WEBAPP_NAME      nombre del App Service (salida appServiceName del Bicep)
#   Secretos  AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#             (de una identidad de Entra con credencial federada para este repositorio; sin contraseñas)
name: Portafolio · publicar en Azure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['portafolio/**']

permissions:
  id-token: write
  contents: read

jobs:
  publicar:
    if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portafolio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci --omit=dev

      - name: Revisar que el código compile
        run: for f in server.js lib/*.js public/js/*.js; do node --check "$f"; done

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publicar
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: portafolio
