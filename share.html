<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan compartido · Gestión Mauro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/plan.css">
<script src="/assets/plan.js"></script>
<style>
  :root{
    --paper:#F6F5F1; --card:#FFFFFF; --sunk:#EFEDE7;
    --ink:#1C1A17; --muted:#6F6A60; --faint:#A29C90;
    --line:rgba(28,26,23,.08);
    --accent:#FFD000; --accent-ink:#8A6A00; --accent-soft:#FFF4CC;
    --good:#2F9E6A; --good-bg:#E2F3EA;
    --warn:#DB940F; --warn-bg:#FBEECB;
    --crit:#DB4A44; --crit-bg:#FBE3E1;
    --cp-ink:#5B3FD4; --cp-late-ink:#B4443E;
    --sans:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#131210; --card:#1C1A16; --sunk:#25221C;
    --ink:#F3EFE6; --muted:#A49C8B; --faint:#6E6858;
    --line:rgba(243,239,230,.10);
    --accent:#FFD000; --accent-ink:#FFD84D; --accent-soft:rgba(255,208,0,.14);
    --good:#46B37E; --good-bg:rgba(70,179,126,.16);
    --warn:#F0AE3A; --warn-bg:rgba(240,174,58,.16);
    --crit:#F0645E; --crit-bg:rgba(240,100,94,.16);
    --cp-ink:#C3B2FF; --cp-late-ink:#F5AFAB;
  }}
  :root[data-theme="dark"]{
    --paper:#131210; --card:#1C1A16; --sunk:#25221C;
    --ink:#F3EFE6; --muted:#A49C8B; --faint:#6E6858;
    --line:rgba(243,239,230,.10);
    --accent:#FFD000; --accent-ink:#FFD84D; --accent-soft:rgba(255,208,0,.14);
    --good:#46B37E; --good-bg:rgba(70,179,126,.16);
    --warn:#F0AE3A; --warn-bg:rgba(240,174,58,.16);
    --crit:#F0645E; --crit-bg:rgba(240,100,94,.16);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;padding:18px 22px 40px}
  @media(max-width:600px){body{padding:12px 16px 32px}}
  .container{max-width:1500px;margin:0 auto}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;margin-bottom:22px;border-radius:999px;background:var(--card);box-shadow:0 2px 18px rgba(28,26,23,.06)}
  @media(max-width:600px){.header{border-radius:24px}}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#1C1A17;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;flex-shrink:0}
  .brand h1{font-size:16px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
  .brand .sub{font-size:11.5px;color:var(--muted);font-weight:500}
  .role{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;font-size:11.5px;font-weight:700}
  .role.edit{background:var(--accent-soft);color:var(--accent-ink)}
  .role.view{background:var(--sunk);color:var(--muted)}
  .kpis{display:flex;gap:30px;flex-wrap:wrap;margin:0 6px 18px}
  .kpis .v{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
  .kpis .s{font-size:17px;font-weight:800;line-height:1.5}
  .kpis .l{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-top:4px}
  .planbar{margin:0 6px 20px;max-width:640px}
  .planbar .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .planbar .row strong{color:var(--ink)}
  .track{height:8px;background:var(--sunk);border-radius:999px;position:relative}
  .track .fill{height:100%;border-radius:999px}
  .track .mark{position:absolute;top:-3px;bottom:-3px;width:3px;border-radius:3px;background:var(--ink);opacity:.6}
  .hint{font-size:11.5px;color:var(--muted);margin:0 6px 14px;max-width:780px}
  .q-empty{padding:40px 16px;text-align:center;color:var(--faint);font-size:13px}

  /* Agregar / proponer actividad */
  .addbox{margin-top:26px;background:var(--card);border-radius:28px;padding:22px 24px;box-shadow:0 1px 2px rgba(28,26,23,.03),0 10px 30px rgba(28,26,23,.045)}
  .addbox h2{font-size:16px;font-weight:800;letter-spacing:-.01em}
  .addbox p{font-size:12px;color:var(--muted);margin:3px 0 16px;max-width:680px}
  .addgrid{display:grid;grid-template-columns:2.2fr 1.3fr 1.3fr .8fr 1fr;gap:10px}
  .addgrid .wide{grid-column:span 3}
  .addgrid .mid{grid-column:span 2}
  @media(max-width:900px){.addgrid{grid-template-columns:1fr 1fr}.addgrid .wide,.addgrid .mid,.addgrid .f-nm{grid-column:span 2}}
  .field label{display:block;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:0 0 6px 12px}
  .field input,.field select{width:100%;border:none;border-radius:999px;padding:10px 16px;font-family:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--sunk);outline:none;transition:.15s}
  .field input:focus,.field select:focus{background:var(--card);box-shadow:0 0 0 3px var(--accent-soft)}
  .addfoot{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
  .addfoot .note{font-size:11.5px;color:var(--muted);margin-right:auto}
  .btn{font-size:13px;font-weight:700;padding:11px 22px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;transition:.15s}
  .btn-primary{background:var(--accent);color:#1C1A17;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 40%,transparent)}
  .btn-primary:hover{filter:brightness(1.04);transform:translateY(-1px)}
  .btn-primary:disabled{opacity:.5;transform:none}
  .ajuste{margin-top:14px;background:var(--card);border-radius:24px;padding:4px 24px;box-shadow:0 1px 2px rgba(28,26,23,.03),0 6px 20px rgba(28,26,23,.035)}
  .ajuste summary{cursor:pointer;list-style:none;padding:14px 0;font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px}
  .ajuste summary::-webkit-details-marker{display:none}
  .ajuste summary::before{content:"▸";font-size:10px;transition:transform .15s}
  .ajuste[open] summary::before{transform:rotate(90deg)}
  .ajuste summary:hover{color:var(--ink)}
  .ajuste .body{padding-bottom:18px}
  .ajgrid{display:grid;grid-template-columns:2fr 1fr 1.4fr;gap:10px}
  .ajgrid .full{grid-column:1/-1}
  @media(max-width:900px){.ajgrid{grid-template-columns:1fr}}
  .btn-soft{background:var(--sunk);color:var(--ink)}
  .btn-soft:hover{background:color-mix(in srgb,var(--ink) 8%,var(--sunk))}
  .toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,16px);background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:500;opacity:0;pointer-events:none;transition:.25s;max-width:90vw}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.err{background:var(--crit)}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="brand">
      <div class="logo">M</div>
      <div style="min-width:0">
        <h1 id="p-name">Cargando…</h1>
        <div class="sub" id="p-sub">Plan de trabajo compartido</div>
      </div>
    </div>
    <span class="role view" id="p-role">…</span>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="planbar" id="planbar"></div>
  <div class="hint" id="hint"></div>
  <div id="plan"><div class="q-empty">Cargando plan…</div></div>

  <div class="addbox" id="addbox" style="display:none">
    <h2 id="add-title">¿Falta algo? Agrega una actividad</h2>
    <p id="add-sub"></p>
    <div class="addgrid">
      <div class="field f-nm wide"><label>Actividad</label><input type="text" id="n-name" placeholder="Ej: Solicitar certificado de tradición y libertad" onkeydown="if(event.key==='Enter')agregar()"></div>
      <div class="field mid"><label>Etapa</label><select id="n-area"></select></div>
      <div class="field"><label>Área responsable</label><input type="text" id="n-resp" placeholder="Ej: Jurídica, Tecnología"></div>
      <div class="field"><label>Duración (días háb.)</label><input type="number" id="n-dur" min="1" max="365" value="3"></div>
      <div class="field"><label>Inicio (opcional)</label><input type="date" id="n-ini"></div>
      <div class="field mid"><label>Entregable (opcional)</label><input type="text" id="n-ent" placeholder="Ej: Certificado vigente"></div>
      <div class="field" id="f-quien"><label>Tu nombre</label><input type="text" id="n-quien" placeholder="Para saber quién la propone" onchange="recordarNombre(this.value)"></div>
    </div>
    <div class="addfoot">
      <span class="note" id="add-note"></span>
      <button class="btn btn-primary" id="n-go" onclick="agregar()">Proponer actividad</button>
    </div>
  </div>

  <details class="ajuste" id="ajbox" style="display:none">
    <summary>¿Una fecha o un dato no cuadra? Propón un ajuste</summary>
    <div class="body">
      <div class="ajgrid">
        <div class="field"><label>Actividad</label><select id="a-act"></select></div>
        <div class="field"><label>Qué cambiar</label><select id="a-campo" onchange="campoAjuste()">
          <option value="deadline">Fecha de fin</option><option value="startDate">Fecha de inicio</option>
          <option value="responsables">Responsable</option><option value="entregable">Entregable</option>
          <option value="name">Nombre</option><option value="nota">Solo un comentario</option>
        </select></div>
        <div class="field"><label id="a-vlab">Nueva fecha</label><input type="date" id="a-val"></div>
        <div class="field full"><label>Por qué (opcional)</label><input type="text" id="a-mot" placeholder="Ej: la notaría da cita hasta el 20"></div>
        <div class="field"><label>Tu nombre</label><input type="text" id="a-quien" placeholder="Para saber quién lo propone" onchange="recordarNombre(this.value)"></div>
      </div>
      <div class="addfoot"><span class="note" id="aj-note"></span><button class="btn btn-soft" id="a-go" onclick="proponerAjuste()">Enviar propuesta</button></div>
    </div>
  </details>
</div>
<div class="toast" id="toast"></div>

<script>
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const token=location.pathname.split('/').filter(Boolean).pop();
  const API='/api/share/'+encodeURIComponent(token);
  const LS='planShareOptsV1';
  let DATA=null;
  let toastT=null;
  function toast(msg,ok=true){const el=$('toast');el.textContent=msg;el.classList.toggle('err',!ok);el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2800);}
  const todayISO=()=>new Date().toLocaleDateString('en-CA');
  function fmtDate(iso){if(!iso)return '—';return new Date(iso+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short'});}
  // El enlace ve el plan y propone; no cambia lo que ya está asentado
  const opts=Plan.opciones(LS,{owner:false,editable:false,panel:true});
  opts.editable=false;
  let nombre='';try{nombre=localStorage.getItem('planShareNombre')||'';}catch(e){}
  function recordarNombre(v){nombre=String(v||'').trim();try{localStorage.setItem('planShareNombre',nombre);}catch(e){}['n-quien','a-quien'].forEach(id=>{if($(id)&&!$(id).value)$(id).value=nombre;});}

  async function api(method,body){
    const res=await fetch(API,{method,headers:body?{'Content-Type':'application/json'}:undefined,body:body?JSON.stringify(body):undefined});
    const data=await res.json().catch(()=>({}));
    if(!res.ok||data.error)throw new Error(data.error||'Error de conexión');
    return data;
  }
  async function load(){
    try{DATA=await api('GET');render();}
    catch(e){
      $('p-name').textContent='Enlace no disponible';
      $('p-sub').textContent=e.message;
      $('p-role').style.display='none';
      $('plan').innerHTML=`<div class="q-empty">⚠ ${esc(e.message)}. Pide un enlace nuevo a quien te lo compartió.</div>`;
    }
  }

  function render(){
    const s=DATA.summary,p=DATA.project;
    $('p-name').textContent=p.name;
    $('p-sub').textContent=(p.responsable?'Responsable: '+p.responsable+' · ':'')+'Plan de trabajo compartido'+(DATA.label?' con '+DATA.label:'');
    const r=$('p-role');r.className='role view';r.textContent='👁 Ver y proponer';
    document.title=p.name+' · Plan de trabajo';
    $('kpis').innerHTML=`
      <div><div class="v">${s.avance}%</div><div class="l">Ejecutado</div></div>
      <div><div class="v">${s.avanceEsperado!=null?s.avanceEsperado+'%':'—'}</div><div class="l">Plan a hoy</div></div>
      <div><div class="s">${fmtDate(s.fechaFinal)}</div><div class="l">Fecha final</div></div>
      <div><div class="v">${s.completadas}/${s.totalActividades}</div><div class="l">Actividades</div></div>
      <div><div class="v" style="color:${s.retrasos?'var(--crit)':'var(--good)'}">${s.retrasos}</div><div class="l">Atrasadas</div></div>
      <div><div class="v" style="color:${s.proximas?'var(--warn)':'var(--ink)'}">${s.proximas}</div><div class="l">Vencen en 7 días</div></div>`;
    if(s.avanceEsperado!=null){
      const delta=s.avance-s.avanceEsperado,col=delta<-10?'var(--crit)':delta<0?'var(--warn)':'var(--good)';
      $('planbar').innerHTML=`<div class="row"><span>Ejecutado <strong>${s.avance}%</strong> vs plan a hoy <strong>${s.avanceEsperado}%</strong></span><span style="color:${col}">${delta>=0?'▲ al día':'▼ '+Math.abs(delta)+' pts por detrás'}</span></div>
        <div class="track"><div class="fill" style="width:${s.avance}%;background:${col}"></div><div class="mark" style="left:${s.avanceEsperado}%"></div></div>`;
    }else $('planbar').innerHTML='';
    $('hint').textContent='Elige tu etapa o tu área arriba (o tu nombre en «Involucrados») para ir directo a lo tuyo. Si falta una actividad o una fecha no cuadra, propónlo abajo: quien lleva el plan lo revisa.'+(p.lineaBaseAt?' La barra gris delgada es la línea base (lo pactado); la de color, lo proyectado.':'');
    renderPlan();
    renderAddBox();
  }
  function renderPlan(){
    const w=$('pl-wrap'),keep=w?[w.scrollLeft,w.scrollTop]:null;
    $('plan').innerHTML=Plan.render(modelo(),opts);
    const n=$('pl-wrap');if(n&&keep){n.scrollLeft=keep[0];n.scrollTop=keep[1];}
  }
  function modelo(){return {sections:DATA.sections,activities:DATA.activities,lineaBase:DATA.project.lineaBaseAt||null,today:(DATA.summary&&DATA.summary.today)||todayISO()};}
  function renderAddBox(){
    const secs=[...(DATA.sections||[])].filter(s=>s.enabled!==false).sort((a,b)=>a.position-b.position);
    const sel=$('n-area'),prev=sel.value;
    sel.innerHTML=secs.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')||'<option value="">— Sin áreas —</option>';
    if(prev&&secs.some(s=>s.id===prev))sel.value=prev;else if(opts.grupo&&secs.some(s=>s.id===opts.grupo))sel.value=opts.grupo;
    $('addbox').style.display='';
    $('add-title').textContent='¿Falta algo? Propón una actividad';
    $('add-sub').textContent='Queda marcada como «Propuesta» en el plan hasta que quien lo lleva la acepte. Con la duración en días hábiles se calcula la fecha de fin (sin fines de semana ni festivos).';
    ['n-quien','a-quien'].forEach(id=>{if(!$(id).value)$(id).value=nombre;});
    // Ajuste: actividades con su ID
    const et=Plan.etapas(modelo());const aSel=$('a-act'),aPrev=aSel.value;
    aSel.innerHTML=et.filter(g=>!(g.sec&&g.sec.enabled===false)).map(g=>`<optgroup label="${esc(g.cod+' · '+g.name)}">${g.acts.map(a=>`<option value="${a.id}">${esc(a._cod+' · '+a.name)}</option>`).join('')}</optgroup>`).join('');
    if(aPrev)aSel.value=aPrev;
    $('ajbox').style.display=(DATA.activities||[]).length?'':'none';
  }

  // ---------- Manejadores de la hoja (assets/plan.js) ----------
  function planSetOpt(k,v){Plan.cambiar(opts,k,v);Plan.guardar(LS,opts);renderPlan();if(k==='grupo'&&v&&DATA.sections.some(s=>s.id===v))$('n-area').value=v;}
  // Ajuste propuesto: el campo define qué se escribe
  function campoAjuste(){
    const c=$('a-campo').value,v=$('a-val');
    const fecha=c==='deadline'||c==='startDate';
    v.type=fecha?'date':'text';v.value='';
    v.placeholder=c==='responsables'?'Ej: Jurídica, Tecnología':c==='nota'?'Tu comentario':'Nuevo valor';
    $('a-vlab').textContent=fecha?'Nueva fecha':c==='nota'?'Comentario':'Nuevo valor';
  }
  async function proponerAjuste(){
    const body={tipo:'ajuste',activityId:$('a-act').value,campo:$('a-campo').value,valor:$('a-val').value.trim(),motivo:$('a-mot').value.trim()||null,propuestoPor:$('a-quien').value.trim()||null};
    if(!body.activityId){toast('⚠ Elige la actividad',false);return;}
    if(!body.valor){toast('⚠ Escribe lo que propones',false);$('a-val').focus();return;}
    $('a-go').disabled=true;
    try{
      await api('POST',body);
      $('a-val').value='';$('a-mot').value='';
      $('aj-note').textContent='✓ Propuesta enviada: quien lleva el plan la revisa.';
      toast('✓ Propuesta enviada');
    }catch(e){toast('⚠ '+e.message,false);}
    finally{$('a-go').disabled=false;}
  }

  async function agregar(){
    const name=$('n-name').value.trim();
    if(!name){toast('⚠ Escribe el nombre de la actividad',false);$('n-name').focus();return;}
    const body={
      name,
      sectionId:$('n-area').value||null,
      responsable:$('n-resp').value.trim()||null,
      duracion:Number($('n-dur').value)||1,
      startDate:$('n-ini').value||null,
      entregable:$('n-ent').value.trim()||null,
      propuestaPor:$('n-quien').value.trim()||null,
    };
    $('n-go').disabled=true;
    try{
      await api('POST',body);
      ['n-name','n-resp','n-ini','n-ent'].forEach(id=>{$(id).value='';});
      $('add-note').textContent='✓ Propuesta enviada: aparece marcada en el plan hasta que la acepten.';
      toast('✓ Propuesta enviada');
      DATA=await api('GET');render();
    }catch(e){toast('⚠ '+e.message,false);}
    finally{$('n-go').disabled=false;}
  }

  load();
</script>
</body>
</html>
